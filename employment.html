  <script>
    function showImage(container, index) {
      const images = container.querySelectorAll('img');
      let current = Array.from(images).findIndex(img => img.classList.contains('active'));
      if (index >= images.length) index = 0;
      if (index < 0) index = images.length - 1;

      images.forEach((img, i) => img.classList.toggle('active', i === index));
    }

    window.nextImage = function (button) {
      const container = button.closest('.benefit-gallery').querySelector('.gallery-container');
      showImage(container, Array.from(container.querySelectorAll('img')).findIndex(img => img.classList.contains('active')) + 1);
    };

    window.prevImage = function (button) {
      const container = button.closest('.benefit-gallery').querySelector('.gallery-container');
      showImage(container, Array.from(container.querySelectorAll('img')).findIndex(img => img.classList.contains('active')) - 1);
    };

  </script>
